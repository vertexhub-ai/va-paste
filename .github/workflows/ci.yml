name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

        with:
          go-version: '1.21'
      - name: Check formatting
        run: |
          # Check for unformatted Go files using gofmt.
          # The -s flag simplifies the code, -d shows diffs instead of writing.
          # If there's any output, it means files are not formatted correctly.
          if [ -n "$(gofmt -s -d .)" ]; then
            echo "ERROR: Unformatted Go files found. Please run 'gofmt -s -w .' to format your code."
            gofmt -s -d . # Print the diff for easier debugging
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Download Go modules
        run: go mod download
      - name: Tidy Go modules
        run: go mod tidy
      - name: Run tests
        run: go test -v ./...
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Run tests
      run: cargo test
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Check formatting
      run: cargo fmt -- --check